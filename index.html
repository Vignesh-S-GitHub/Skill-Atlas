<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Every place to find agent skills, in one search. Browse, save, and compare directories and repositories for SKILL.md." />
    <meta name="theme-color" content="#141511" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <script>
      try {
        const theme = localStorage.getItem('skillatlas-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <title>SkillAtlas — Find your next agent skill</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
